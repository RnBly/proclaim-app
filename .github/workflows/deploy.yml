name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Create secrets.dart
      run: |
        mkdir -p lib/config
        cat > lib/config/secrets.dart << 'EOF'
        class Secrets {
          static const String SPREADSHEET_ID = '1dzHDX6LYR0qzkijQ_bWMBlSQGhGrMj4S';
          static const String OLD_TESTAMENT_SHEET = 'Old Testament';
          static const String PSALMS_SHEET = 'Psalms';
          static const String NEW_TESTAMENT_SHEET = 'New Testament';
          static const String MONTHLY_READING_SHEET = '1month';
          static const String MONTHLY_PSALMS_SHEET = '1month_ps';
          static const String BIBLE_JSON_URL = 'https://raw.githubusercontent.com/RnBly/proclaim-app/main/assets/bible.json';
          static const String BIBLE_ESV_JSON_URL = 'https://raw.githubusercontent.com/RnBly/proclaim-app/main/assets/bible_esv.json';
          
          static String getSheetCsvUrl(String sheetName) {
            return 'https://docs.google.com/spreadsheets/d/\$SPREADSHEET_ID/gviz/tq?tqx=out:csv&sheet=\$sheetName';
          }
        }
        EOF
    
    - name: Build web
      run: flutter build web --release --base-href "/proclaim-app/"
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web